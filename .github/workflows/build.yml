name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 順序：Rules → Sources → Schemas → Governance → Integrity → Versions → Research
      #       → 覆蓋率 → 差分（calendar / natal / period）→ Golden → Tests → Build
      #       → Release Smoke → A11y → standalone → Pages
      - run: npm run validate:rules
      - run: npm run validate:sources
      - run: npm run validate:schemas
      - run: npm run validate:governance
      - run: npm run validate:integrity
      - run: npm run validate:versions
      - run: npm run validate:research
      - run: npm run validate:catalogs
      - run: npm run assimilation:star-gap:check
      - run: npm run coverage:bible
      - run: npm run differential:calendar -- --check
      - run: npm run differential
      - run: npm run differential:period
      - run: npm run verify:golden
      - run: npm run test
      - run: npm run build
      - run: npm run release:smoke
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:a11y
      - run: node tools/build-standalone.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
